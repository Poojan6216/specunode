name: publish

# Publishes to PyPI when a GitHub release is published, through PyPI's Trusted Publishing:
# PyPI verifies that the upload comes from this repository's workflow, so there is no token to
# store, rotate or leak. The PyPI side is a "pending publisher" (project specunode, owner
# Poojan6216, repository specunode, workflow publish.yml, environment pypi).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: the release tag names the version being published
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "release tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the whole of the credential: PyPI checks this workflow's identity
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
