[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specunode"
version = "0.1.0"
description = "A runtime for AI agents whose tools change the world: every write held until the model's decision is durable, claimed under a deterministic key so a crash never sends it twice, and every run journaled and replayable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Poojan Patel" }]
keywords = ["llm", "agents", "tool-calling", "idempotency", "durable-execution", "crash-recovery", "langgraph", "mcp", "speculative-execution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "pyyaml>=6.0",
  "cryptography>=42.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
langgraph = ["langgraph>=0.6", "langchain-core>=0.3"]
mcp = ["mcp>=1.2"]
postgres = ["psycopg[binary]>=3.1"]
local-draft = ["transformers>=4.44", "torch>=2.2"]
bench = ["matplotlib>=3.8", "numpy>=1.26", "datasets>=2.20", "reportlab>=4.1"]

[project.urls]
Homepage = "https://github.com/Poojan6216/specunode"
Repository = "https://github.com/Poojan6216/specunode"
Documentation = "https://github.com/Poojan6216/specunode/tree/main/docs"
Results = "https://github.com/Poojan6216/specunode/blob/main/RESULTS.md"
Issues = "https://github.com/Poojan6216/specunode/issues"

[project.scripts]
specunode = "specunode.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "ruff>=0.5",
  "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/specunode"]

[tool.hatch.build.targets.sdist]
include = ["src/specunode", "tests", "bench", "examples", "docs", "README.md", "LICENSE"]

# The config template lives inside the package so that `specunode init` works from an installed
# wheel. It used to sit at the repo root, be read via parents[2], and ship in neither
# distribution -- so every installed user got an 18-byte config from the fallback branch.
[tool.hatch.build.targets.wheel.force-include]
"src/specunode/specunode.yaml.example" = "specunode/specunode.yaml.example"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "bench", "examples"]

[tool.ruff.format]
# Ruff 0.16 formats Python code blocks inside Markdown. The ones in BUILD_SPEC.md and docs/
# are interface sketches whose comments are aligned by hand to be read side by side.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "PTH", "TID"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
# No python_version: checked as the interpreter it runs under -- 3.11 in CI's lint job. Held to
# 3.11 under a newer interpreter, it could not read the stubs of numpy 2.5 (a ``type``
# statement), which psycopg's stubs import and mypy always follows. Ruff's target-version keeps
# the source itself to 3.11 syntax.
strict = true
files = ["src/specunode"]
warn_unreachable = true
disallow_any_explicit = false
plugins = []

[[tool.mypy.overrides]]
module = [
  "ulid.*",
  "langgraph.*",
  "langchain_core.*",
  "mcp.*",
  "anthropic.*",
  "psycopg.*",
  "datasets.*",
  "matplotlib.*",
  "reportlab.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The repo root, so ``examples`` and ``bench.workloads`` import the same way whether
# pytest is invoked bare or with an explicit file path. Without it the mandatory tests
# collect under ``pytest`` and fail to import under ``pytest tests/test_equivalence.py``,
# which is exactly the invocation someone debugging one of them would reach for.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "slow: long-running tests",
  "postgres: requires a Postgres 16 instance",
  "online: requires a live model API key",
]
filterwarnings = ["error::DeprecationWarning:specunode.*"]
