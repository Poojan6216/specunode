name: nightly-online

# The online benchmarks call real models and therefore cost money. They run only when
# ANTHROPIC_API_KEY is configured. The input budget is the ceiling for the WHOLE job and is
# split between the three benchmarks below: each script enforces its own cap, so giving every
# one the full budget would let the job spend three times what was asked. Decision Gate D2:
# a benchmark that reaches its share records the reduced n and its wider interval. A cap is
# never raised silently.
on:
  schedule: [{ cron: "0 5 * * 0" }]
  workflow_dispatch:
    inputs:
      budget_usd:
        description: "Spend cap in USD for this run"
        default: "25"

jobs:
  online:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: bench
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SPECUNODE_BENCH_BUDGET_USD: ${{ inputs.budget_usd || '25' }}
    steps:
      - uses: actions/checkout@v4
      - name: skip if no key is configured
        id: gate
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "no ANTHROPIC_API_KEY configured; the online bench cannot run" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v5
        if: steps.gate.outputs.run == 'true'
        with:
          enable-cache: true
      - run: uv python install 3.11
        if: steps.gate.outputs.run == 'true'
      # Not --all-extras: that pulls the local-draft extra's torch, which has no wheel for
      # every runner in this matrix, so the job fails at install before a test runs. The
      # tier-2 local drafter is exercised by its own job where a wheel exists.
      - run: uv sync --extra anthropic --extra langgraph --extra mcp --extra postgres --extra bench --dev
        if: steps.gate.outputs.run == 'true'
      - name: split the budget between the three benchmarks
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 - <<'EOF' >> "$GITHUB_ENV"
          import os
          total = float(os.environ["SPECUNODE_BENCH_BUDGET_USD"])
          for name, share in (("LATENCY", 0.2), ("SWEEP", 0.5), ("TIER2", 0.3)):
              print(f"BUDGET_{name}={total * share:.2f}")
          EOF
      - name: online latency bench, budget-capped
        if: steps.gate.outputs.run == 'true'
        run: >-
          SPECUNODE_BENCH_BUDGET_USD=$BUDGET_LATENCY
          uv run python bench/online/run_latency.py --tasks 20 --out bench/results/latency.json
      - name: tool-latency sweep, budget-capped
        if: steps.gate.outputs.run == 'true'
        run: >-
          SPECUNODE_BENCH_BUDGET_USD=$BUDGET_SWEEP
          uv run python bench/online/run_latency_sweep.py --tasks 20 --ladder 0,500,2000
          --out bench/results/sweep.json
      - name: undigested corpus values for the draft model (network, no model cost)
        if: steps.gate.outputs.run == 'true'
        run: uv run python bench/corpus/fetch.py --values --full
      - name: tier-2 acceptance, budget-capped
        if: steps.gate.outputs.run == 'true'
        run: >-
          SPECUNODE_BENCH_BUDGET_USD=$BUDGET_TIER2
          uv run python bench/online/run_tier2_acceptance.py --sample 1000
          --out bench/results/tier2.json
      - name: regenerate RESULTS.md
        if: steps.gate.outputs.run == 'true'
        run: |
          uv run python bench/report.py
          uv run python bench/check_numbers.py
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: online-results
          path: |
            bench/results/latency.json
            bench/results/sweep.json
            bench/results/tier2.json
            RESULTS.md
